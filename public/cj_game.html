<!DOCTYPE html>
<html>
    <body>
        <link rel="stylesheet" href="styles/cj_game_styles.css">

       <div class = "Typing Game">
            <h1>Touch Typing Game</h1>
            
            <p>Type all of the letters as fast as you can!</p>

            <p>abcdefghijklmnopqrstuvwxyz!?$%</p>
            
            <div id ="timer" class = "working">

                <p id="timer-text">00:00</p>
                <div class="edit-controls">
            </div>
                <p id="timer-popup"></p>
            </div>
        </div>
</html>
