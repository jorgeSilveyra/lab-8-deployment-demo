<!DOCTYPE html>
<html>
    <head> 
        <title>Typing Game</title>
         <link rel="stylesheet" href="css/cj_game_styles.css">
    </head>
    <body>

       <div class = "Typing Game">
            <h1>Touch Typing Game</h1>
            
            <p>Type all of the letters as fast as you can!</p>

            <p id ="target-text"></p>
            
            <div id ="timer"> 
                <button id="start-button">Start</button>
                <input id="string-input" type = "text">
                <button id="finish">Finished</button>
                <p id="timer-text">00:00</p>
                <p id="timer-popup"></p>
                <button id="reset">Reset</button>
            </div>
        </div>

        <script src ="js/cj_game.js"></script>
    </body>
</html>
